name: Compilar GKI + KernelSU + SUSFS (todas las versiones, LTS)

# Compila la versión LTS de cada rama GKI con KernelSU y SUSFS reutilizando
# build.yml, que ya integra KernelSU, copia los fuentes de SUSFS, aplica
# scripts/susfs_fixes y usa el Clang de AOSP.

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "Variante de KernelSU"
        required: true
        type: choice
        options:
          - Official
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU

      artifact_upload_mode:
        description: "Modo de subida de archivos compilados"
        required: true
        type: choice
        options:
          - "Subir únicamente AnyKernel3.zip"
          - "Subir todos los archivos"
        default: "Subir únicamente AnyKernel3.zip"

jobs:
  build:
    name: "${{ matrix.android_version }}-${{ matrix.kernel_version }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_version: android12
            kernel_version: "5.10"
          - android_version: android13
            kernel_version: "5.15"
          - android_version: android14
            kernel_version: "6.1"
          - android_version: android15
            kernel_version: "6.6"
          - android_version: android16
            kernel_version: "6.12"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      sub_level: "X"
      os_patch_level: "lts"
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      enable_susfs: true
      ksu_mode: "关闭"
      use_zram: false
      use_bbg: false
      use_kpm: "disabled (关闭)"
      artifact_upload_mode: ${{ inputs.artifact_upload_mode == 'Subir todos los archivos' && '上传全部' || '仅上传 AnyKernel3.zip' }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
