```yaml
name: Android Kernel Build - Personalizado

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Opciones desplegables ====================
      kernel_version:
        description: "Versión del kernel"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"

      kernelsu_variant:
        description: "Variante de KernelSU"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU

      ksu_mode:
        description: "Modo KernelSU / SUSFS"
        required: true
        type: choice
        options:
          - "Desactivado"
          - "Desactivar SUSFS"
          - "Desactivar KSU"
        default: "Desactivado"

      use_kpm:
        description: "Función KPM (patched aún no es compatible)"
        required: true
        type: choice
        default: "disabled (Desactivado)"
        options:
          - "disabled (Desactivado)"
          - "enabled (Activado)"
          - "patched (Activado y parcheado, aún no compatible)"

      droidspaces:
        description: "Compatibilidad con contenedores Droidspaces (5.10~6.6: parche de ranuras, 6.12: activar/desactivar)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"

      artifact_upload_mode:
        description: "Modo de subida de archivos compilados"
        required: true
        type: choice
        options:
          - "Subir únicamente AnyKernel3.zip"
          - "Subir todos los archivos"
        default: "Subir únicamente AnyKernel3.zip"

      # ==================== Entradas de texto ====================
      os_patch_level:
        description: "Nivel del parche de seguridad (ej.: 2022-01, lts)"
        required: true
        type: string
        default: "2022-01"

      version:
        description: "Nombre personalizado de la versión (opcional)"
        required: false
        type: string

      build_time:
        description: "Fecha y hora personalizada de compilación (opcional, N o vacío = UTC actual)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Interruptores (desactivados por defecto) ====================
      use_zram:
        description: "Activar algoritmos mejorados de ZRAM"
        required: true
        type: boolean
        default: false

      use_bbg:
        description: "Activar protección BBG contra bloqueos del dispositivo"
        required: true
        type: boolean
        default: false

      use_rekernel:
        description: "Activar el controlador Re-Kernel"
        required: false
        type: boolean
        default: false

      use_nomount:
        description: "Activar el módulo de montaje NoMount"
        required: false
        type: boolean
        default: false

      use_networking:
        description: "Activar mejoras de red (BBRv3 / IPSet / Qdisc / CIFS)"
        required: false
        type: boolean
        default: false

      cve_2026_43499_patch:
        description: "Aplicar la cadena de correcciones rtmutex para CVE-2026-43499"
        required: false
        type: boolean
        default: false

      supp_op:
        description: "Activar compatibilidad con OnePlus 8E"
        required: false
        type: boolean
        default: false

      droidspaces_ntsync:
        description: "Activar compatibilidad NTSync para contenedores Droidspaces (requiere Droidspaces activado)"
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
    steps:
      - name: Obtener datos de versiones
        uses: actions/checkout@v7

      - name: Resolver nivel del parche de seguridad
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          os_patch_level = os.environ["OS_PATCH_LEVEL"].strip()
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
          }
          android_version = android_map.get(kernel_version)
          if android_version is None:
              print(f"::error::Versión de kernel no compatible: {kernel_version}")
              sys.exit(1)

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::No se encontraron los datos de versión: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if os_patch_level == "lts":
              kernel_full = data.get("lts")
              if not kernel_full:
                  print(f"::error::Faltan los datos de la versión LTS para {android_version} / {kernel_version}")
                  sys.exit(1)
              sub_level = "X"
          else:
              matched = next(
                  (entry for entry in data.get("entries", []) if entry.get("date") == os_patch_level),
                  None,
              )
              if matched is None:
                  print(f"::error::No se encontraron datos de versión para {android_version} / {kernel_version} / {os_patch_level}")
                  sys.exit(1)
              kernel_full = matched.get("kernel", "")
              prefix = f"{kernel_version}."
              if not kernel_full.startswith(prefix):
                  print(f"::error::Datos de versión incorrectos: {kernel_full} no pertenece a {kernel_version}")
                  sys.exit(1)
              sub_level = kernel_full.rsplit(".", 1)[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              output.write(f"sub_level={sub_level}\n")
              output.write(f"kernel_full={kernel_full}\n")

          print(f"Resultado: {android_version} / {kernel_full}, número de subversión: {sub_level}")
          PY

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ inputs.os_patch_level }}"
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != 'Desactivar SUSFS' && inputs.ksu_mode != 'Desactivar KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || 'Desactivado' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
```
