```yaml
name: Compilación del Kernel - Android 12 (5.10)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Opciones desplegables ====================
      kernelsu_variant:
        description: "Variante de KernelSU"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU

      ksu_mode:
        description: "Modo KernelSU / SUSFS"
        required: true
        type: choice
        options:
          - "Desactivado"
          - "Desactivar SUSFS"
          - "Desactivar KSU"
        default: "Desactivado"

      use_kpm:
        description: "Función KPM (patched aún no es compatible)"
        required: true
        type: choice
        default: "disabled (Desactivado)"
        options:
          - "disabled (Desactivado)"
          - "enabled (Activado)"
          - "patched (Activado y parcheado, aún no compatible)"

      droidspaces:
        description: "Compatibilidad con contenedores Droidspaces"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"

      artifact_upload_mode:
        description: "Modo de subida de archivos compilados"
        required: true
        type: choice
        options:
          - "Subir únicamente AnyKernel3.zip"
          - "Subir todos los archivos"
        default: "Subir únicamente AnyKernel3.zip"

      # ==================== Entradas de texto ====================
      version:
        description: "Nombre personalizado de la versión (opcional)"
        required: false
        type: string

      build_time:
        description: "Fecha y hora personalizada de compilación (opcional, N o vacío = UTC actual)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Interruptores (desactivados por defecto) ====================
      use_zram:
        description: "Activar algoritmos mejorados de ZRAM"
        required: true
        type: boolean
        default: false

      use_bbg:
        description: "Activar protección BBG contra bloqueos del dispositivo"
        required: true
        type: boolean
        default: false

      use_rekernel:
        description: "Activar el controlador Re-Kernel"
        required: false
        type: boolean
        default: false

      use_nomount:
        description: "Activar el módulo de montaje NoMount"
        required: false
        type: boolean
        default: false

      use_networking:
        description: "Activar mejoras de red (BBRv3 / IPSet / Qdisc / CIFS)"
        required: false
        type: boolean
        default: false

      cve_2026_43499_patch:
        description: "Aplicar la cadena de correcciones rtmutex para CVE-2026-43499"
        required: false
        type: boolean
        default: false

      droidspaces_ntsync:
        description: "Activar compatibilidad NTSync para contenedores Droidspaces (requiere Droidspaces activado)"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string

      version:
        required: false
        type: string

      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      use_zram:
        required: true
        type: boolean

      use_bbg:
        required: true
        type: boolean

      use_kpm:
        required: true
        type: string

      use_rekernel:
        required: false
        type: boolean
        default: false

      use_nomount:
        required: false
        type: boolean
        default: false

      use_networking:
        required: false
        type: boolean
        default: false

      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false

      ksu_mode:
        required: false
        type: string
        default: "Desactivado"

      droidspaces:
        required: false
        type: string
        default: "off"

      artifact_upload_mode:
        required: false
        type: string
        default: "Subir todos los archivos"

      droidspaces_ntsync:
        required: false
        type: boolean
        default: false

      called_from_main:
        description: "Indica si se ejecuta desde main.yml (uso interno)"
        required: false
        type: boolean
        default: false

      export_susfs_patches:
        description: "Exportar parches de integración SUSFS (proporcionado por main.yml)"
        required: false
        type: boolean
        default: false

jobs:
  build-kernels-a12-5-10:
    name: "5.10.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "66"
            os_patch_level: "2022-01"
            revision: "r11"
          - sub_level: "81"
            os_patch_level: "2022-03"
            revision: "r11"
          - sub_level: "101"
            os_patch_level: "2022-04"
            revision: "r28"
          - sub_level: "110"
            os_patch_level: "2022-07"
            revision: "r1"
          - sub_level: "117"
            os_patch_level: "2022-09"
            revision: "r1"
          - sub_level: "136"
            os_patch_level: "2022-11"
            revision: "r15"
          - sub_level: "149"
            os_patch_level: "2023-01"
            revision: "r1"
          - sub_level: "160"
            os_patch_level: "2023-03"
            revision: "r1"
          - sub_level: "168"
            os_patch_level: "2023-04"
            revision: "r9"
          - sub_level: "177"
            os_patch_level: "2023-07"
            revision: "r3"
          - sub_level: "185"
            os_patch_level: "2023-09"
            revision: "r1"
          - sub_level: "198"
            os_patch_level: "2024-01"
            revision: "r17"
          - sub_level: "205"
            os_patch_level: "2024-03"
            revision: "r1"
          - sub_level: "209"
            os_patch_level: "2024-05"
            revision: "r13"
          - sub_level: "218"
            os_patch_level: "2024-08"
            revision: "r14"
          - sub_level: "226"
            os_patch_level: "2024-11"
            revision: "r8"
          - sub_level: "233"
            os_patch_level: "2025-02"
            revision: "r1"
          - sub_level: "236"
            os_patch_level: "2025-05"
            revision: "r1"
          - sub_level: "237"
            os_patch_level: "2025-06"
            revision: "r1"
          - sub_level: "240"
            os_patch_level: "2025-09"
            revision: "r1"
          - sub_level: "246"
            os_patch_level: "2025-12"
            revision: "r1"
          - sub_level: "X"
            os_patch_level: "lts"
            revision: "r1"

    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != 'Desactivar SUSFS' && inputs.ksu_mode != 'Desactivar KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || 'Desactivado' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  # Solo se ejecuta cuando se inicia directamente; se omite si se llama desde main.yml
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
```
